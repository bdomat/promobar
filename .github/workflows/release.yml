name: Publish stable release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  compatibility:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/compatibility.yml
  package:
    needs: compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      sha: ${{ steps.package.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: promobar
      - name: Validate version and exact main commit, then build ZIP
        id: package
        working-directory: promobar
        env:
          RELEASE_REF: ${{ github.ref }}
        run: python3 tools/prepare-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-release
          path: promobar/dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-release
      - name: Publish stable release once with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          SOURCE_SHA: ${{ needs.package.outputs.sha }}
          MODULE_NAME: promobar
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          if gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > existing-release.json; then
            python3 - <<'PYTHON'
          import json, os, re
          release = json.load(open('existing-release.json'))
          if release['draft'] or release['prerelease']:
              raise SystemExit('Existing draft or prerelease requires review; nothing overwritten')
          assets = {item['name']: item for item in release['assets']}
          for name in [os.environ['MODULE_NAME'] + '.zip', 'SHA256SUMS.txt']:
              asset = assets.get(name)
              if not asset or asset['state'] != 'uploaded' or asset['size'] <= 0 or not re.fullmatch(r'sha256:[0-9a-f]{64}', asset.get('digest') or ''):
                  raise SystemExit('Existing release assets are incomplete; nothing overwritten')
          print('Complete stable release already exists; nothing changed')
          PYTHON
            gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha > /dev/null
            exit 0
          fi
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_SHA"
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_SHA" > /dev/null
          fi
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_SHA"
          gh release create "$RELEASE_TAG" promobar.zip SHA256SUMS.txt \
            --verify-tag --draft --title "PromoBar $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > uploaded-release.json
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          release = json.load(open('uploaded-release.json'))
          assert release['draft'] and not release['prerelease']
          assets = {item['name']: item for item in release['assets']}
          expected = [os.environ['MODULE_NAME'] + '.zip', 'SHA256SUMS.txt']
          assert set(assets) == set(expected)
          for name in expected:
              asset = assets[name]
              data = Path(name).read_bytes()
              assert asset['state'] == 'uploaded' and asset['size'] == len(data)
              assert asset.get('digest') == 'sha256:' + hashlib.sha256(data).hexdigest()
          PYTHON
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_SHA"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = "$RELEASE_TAG"
