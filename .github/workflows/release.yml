name: Publish stable release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compatibility:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/compatibility.yml
  package:
    needs: compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: promobar
      - name: Validate stable tag and build installable ZIP
        working-directory: promobar
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/prepare-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-release
          path: promobar/dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-release
      - name: Publish versioned release with stable asset name
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" promobar.zip SHA256SUMS.txt \
            --verify-tag --latest --title "PromoBar $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md
